<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Botfia</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app" class="app">
    <header id="bar" class="bar">
      <button id="brand" class="brand" aria-label="Botfia, hold for host controls">BOTFIA</button>
      <span id="status-dot" class="dot" title="connection"></span>
    </header>
    <section id="screen" class="screen"></section>
  </main>

  <div id="host-sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
</body>
</html>
